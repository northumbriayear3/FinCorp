name: Daily Commodity Forecast Update

on:
  workflow_dispatch:
  schedule:
    # Runs daily at 08:00 UTC. In summer UK time this is 09:00 BST.
    - cron: "0 8 * * *"

jobs:
  update-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily forecast updater
        env:
          PLATFORM_API_KEY: ${{ secrets.PLATFORM_API_KEY }}
          PLATFORM_FORECAST_API_URL: ${{ secrets.PLATFORM_FORECAST_API_URL }}
        run: python daily_update.py
