name: Daily Commodity Forecast Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

jobs:
  update-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PLATFORM_API_KEY: ${{ secrets.PLATFORM_API_KEY }}
      PLATFORM_FORECAST_API_URL: ${{ secrets.PLATFORM_FORECAST_API_URL }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify protected updater
        run: grep -n "TEMP_PROTECT_GOLD_ROWS_CRUDE_NATGAS_ONLY_2026_07_28" daily_update.py

      - name: Run daily forecast updater
        run: python daily_update.py
